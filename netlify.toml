[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26.13.1"

# www -> apex, permanent.
[[redirects]]
  from = "https://www.mypagesnetwork.com/*"
  to = "https://mypagesnetwork.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.mypagesnetwork.com/*"
  to = "https://mypagesnetwork.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Only self + the cookieless analytics domain. Inline styles are allowed for the
    # self-hosted font-face block Astro emits; no inline scripts are allowed.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io; connect-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprinted build assets (JS, CSS, fonts, optimized images) never change.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
